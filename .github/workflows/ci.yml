name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Typecheck before tests: a type error is the cheapest failure to read.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # The build also regenerates supabase/functions/mcp/index.ts via the Vite
      # plugin. If that output differs from what was committed, the deployed MCP
      # server would not match src/lib/mcp — which is exactly how the live
      # delete_idea hard-delete bug survived a green local test run.
      - name: Build
        run: npm run build

      - name: Generated MCP server is in sync with src/lib/mcp
        run: git diff --exit-code -- supabase/functions/mcp/index.ts
