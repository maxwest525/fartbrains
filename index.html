<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Content Security Policy. Delivered as a meta tag so it ships with the app
      regardless of host; the same policy SHOULD also be sent as a real response
      header (along with X-Content-Type-Options, Referrer-Policy and
      Permissions-Policy) at the CDN — see docs/DEPLOYMENT.md. frame-ancestors
      and X-Frame-Options are header-only and are not enforceable from here.

      'unsafe-inline' on style-src is required by the styling approach in use
      (inline style attributes from Radix/Tailwind); script-src does NOT allow
      inline script.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com data:;
               img-src 'self' data: blob: https:;
               media-src 'self' blob: https:;
               connect-src 'self' https://*.supabase.co wss://*.supabase.co;
               form-action 'self';
               base-uri 'self';
               object-src 'none';
               frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Fart Brains</title>
    <meta name="description" content="Save the reel, get the build brief. Fart Brains turns what you capture — reels, videos, articles, half-formed notes — into a prompt your own AI agent can build from. One endpoint, nothing installed.">
    <meta name="robots" content="index,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
    <!-- Instrument Serif is the display accent site-wide and IBM Plex Mono the
         terminal face. Loaded here rather than injected at runtime so the first
         paint already has them and the hero does not flash Georgia. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
